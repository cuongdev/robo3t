name: Release

# Builds the macOS app (Intel, runs on Apple Silicon through Rosetta), signs and notarizes it
# when the signing secrets are set, and for v* tags publishes it as a GitHub release.
# Run it by hand (workflow_dispatch) to only build and sign.
# The build steps follow docs/BuildRobo3TOnMacAndLinux.md, section C.
#
# Security: secrets are only given to the sign-macos job, which runs no third party build
# code, only this repository's bin/sign-notarize-macos and Apple's tools. Actions are pinned
# to commit SHAs.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned build dependencies
  ROBO_SHELL_REPO: https://github.com/paralect/robomongo-shell.git
  ROBO_SHELL_COMMIT: 6cdb6abcd43f9dba8f198d1e98deda432b894d7f   # branch roboshell-v4.2
  MONGO_VERSION: 4.2.6
  QT_VERSION: 5.15.2
  AQTINSTALL_VERSION: 3.3.0
  OPENSSL_VERSION: 3.5.9
  OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
  MACOS_MIN: "11.0"
  # Apple's "Developer ID Certification Authority" (G2) intermediate, issuer of the signing certificate
  DEVELOPER_ID_G2_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          major=$(sed -nE 's/^set\(PROJECT_VERSION_MAJOR "([0-9]+)"\)/\1/p' CMakeLists.txt)
          minor=$(sed -nE 's/^set\(PROJECT_VERSION_MINOR "([0-9]+)"\)/\1/p' CMakeLists.txt)
          patch=$(sed -nE 's/^set\(PROJECT_VERSION_PATCH "([0-9]+)"\)/\1/p' CMakeLists.txt)
          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in CMakeLists.txt"
            exit 1
          fi

      - name: Prepare environment
        id: env
        run: |
          echo "DEPS=$RUNNER_TEMP/deps" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/deps"
          # Qt build tools (moc, rcc, uic) and the unit tests are Intel binaries
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '_')" >> "$GITHUB_OUTPUT"
          # Python 3.9 from Xcode: the SCons bundled with MongoDB 4.2 does not run on newer Pythons
          /usr/bin/python3 -m venv "$RUNNER_TEMP/deps/venv"
          "$RUNNER_TEMP/deps/venv/bin/pip" install --quiet --upgrade pip "aqtinstall==$AQTINSTALL_VERSION"

      - name: Restore Qt
        id: qt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/deps/Qt
          key: qt-${{ env.QT_VERSION }}-clang_64-qtwebengine-v1

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          QT_LIB="$DEPS/Qt/$QT_VERSION/clang_64/lib"
          for attempt in 1 2 3; do
            "$DEPS/venv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 -m qtwebengine \
              -O "$DEPS/Qt" -b https://download.qt.io/ && [ -d "$QT_LIB/QtWebEngineWidgets.framework" ] && break
            echo "Qt install attempt $attempt was incomplete, retrying"
            sleep 30
          done
          # aqt can exit successfully after a mirror fails, so check the result
          test -d "$QT_LIB/QtWebEngineWidgets.framework"
          test -d "$QT_LIB/QtQmlModels.framework"

      - name: Restore OpenSSL
        id: openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/deps/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-x86_64-macos${{ env.MACOS_MIN }}-v1

      - name: Build OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DEPS/download" && cd "$DEPS/download"
          gh release download "openssl-$OPENSSL_VERSION" -R openssl/openssl -p "openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  openssl-$OPENSSL_VERSION.tar.gz" | shasum -a 256 -c -
          tar -xzf "openssl-$OPENSSL_VERSION.tar.gz"
          mv "openssl-$OPENSSL_VERSION" "$DEPS/openssl"
          cd "$DEPS/openssl"
          ./Configure darwin64-x86_64-cc shared no-ssl3 no-comp no-tests "-mmacosx-version-min=$MACOS_MIN" \
            AR=/usr/bin/ar RANLIB=/usr/bin/ranlib
          make -j"$JOBS" build_libs
          install_name_tool -id "@rpath/lib/libcrypto.3.dylib" libcrypto.3.dylib
          install_name_tool -id "@rpath/lib/libssl.3.dylib" \
            -change /usr/local/lib/libcrypto.3.dylib @rpath/lib/libcrypto.3.dylib libssl.3.dylib
          codesign --force --sign - libssl.3.dylib libcrypto.3.dylib
          # For robo_unit_tests
          mkdir -p lib && cp -a libssl.3.dylib libcrypto.3.dylib lib/

      - name: Restore Robo 3T Shell (MongoDB 4.2 fork)
        id: shell-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/deps/robomongo-shell
          key: robo-shell-${{ env.ROBO_SHELL_COMMIT }}-${{ hashFiles('docs/patches/robomongo-shell-v4.2-modern-macos.patch') }}-${{ steps.env.outputs.xcode }}-macos${{ env.MACOS_MIN }}-v1

      - name: Build Robo 3T Shell (MongoDB 4.2 fork)
        if: steps.shell-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$DEPS/robomongo-shell"
          cd "$DEPS/robomongo-shell"
          git remote add origin "$ROBO_SHELL_REPO"
          git fetch -q --depth 1 origin "$ROBO_SHELL_COMMIT"
          git checkout -q FETCH_HEAD
          git apply "$GITHUB_WORKSPACE/docs/patches/robomongo-shell-v4.2-modern-macos.patch"
          "$DEPS/venv/bin/pip" install --quiet -r etc/pip/compile-requirements.txt
          FLAGS="-arch x86_64 -mmacosx-version-min=$MACOS_MIN -Wno-unused-function -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION"
          "$DEPS/venv/bin/python" buildscripts/scons.py mongo --ssl "MONGO_VERSION=$MONGO_VERSION" \
            "CCFLAGS=$FLAGS" "LINKFLAGS=-arch x86_64 -mmacosx-version-min=$MACOS_MIN" \
            --disable-warnings-as-errors -j"$JOBS"
          # The app links these object files directly
          missing=0
          for o in $(cat "$GITHUB_WORKSPACE/cmake/mongodb/macosx-release.objects"); do
            [ -f "$o" ] || { echo "missing: $o"; missing=1; }
          done
          exit $missing

      # Saved right away, so a later failure does not throw away this long build
      - name: Save Robo 3T Shell build
        if: steps.shell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/deps/robomongo-shell
          key: ${{ steps.shell-cache.outputs.cache-primary-key }}

      - name: Build Robo 3T
        run: |
          mkdir -p build/release && cd build/release
          # CMAKE_POLICY_VERSION_MINIMUM: runners have CMake 4, which refuses projects that
          # declare a minimum below 3.5, like the bundled googletest 1.8.1
          cmake -D "CMAKE_PREFIX_PATH=$DEPS/Qt/$QT_VERSION/clang_64;$DEPS/robomongo-shell;$DEPS/openssl" \
                -D CMAKE_BUILD_TYPE=Release -D "CMAKE_INSTALL_PREFIX=$PWD/install" \
                -D CMAKE_OSX_ARCHITECTURES=x86_64 -D CMAKE_AR=/usr/bin/ar -D CMAKE_RANLIB=/usr/bin/ranlib \
                -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -Wno-dev ../..
          cmake --build . -j "$JOBS"

      - name: Unit tests
        run: build/release/src/robomongo-unit-tests/robo_unit_tests

      - name: Install and check the app bundle
        run: |
          cmake --install build/release
          APP="build/release/install/Robo 3T.app"
          # Every @rpath library must resolve inside the bundle
          missing=0
          while IFS= read -r -d '' f; do
            file "$f" | grep -q Mach-O || continue
            for r in $(otool -L "$f" | tail -n +2 | awk '{print $1}' | grep '^@rpath/'); do
              [ -e "$APP/Contents/Frameworks/${r#@rpath/}" ] || { echo "missing $r (used by $f)"; missing=1; }
            done
          done < <(find "$APP" -type f -print0)
          exit $missing

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="robo3t-$VERSION-macos-x86_64"
          APP="build/release/install/Robo 3T.app"
          # Ad hoc signature here; the sign-macos job replaces it with a Developer ID signature
          codesign --force --deep --sign - "$APP"
          mkdir -p dist dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname "Robo 3T $VERSION" -srcfolder dmg-root -ov -format UDZO "dist/$NAME.dmg" && break
            echo "hdiutil attempt $attempt failed, retrying"
            sleep 10
          done
          test -f "dist/$NAME.dmg"
          # ditto keeps the framework symlinks that the sign job needs
          ditto -c -k --keepParent "$APP" "dist/$NAME.zip"
          cd dist && shasum -a 256 "$NAME.dmg" "$NAME.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robo3t-macos-unsigned
          path: dist/
          if-no-files-found: error

  # Signing needs these secrets in the "release" environment (see README, "Signing and notarizing"):
  #   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, MACOS_NOTARY_APPLE_ID,
  #   MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD (app-specific password).
  # Without them (forks, for example) the ad hoc signed build is passed on unchanged.
  sign-macos:
    name: Sign and notarize macOS app
    needs: build-macos
    runs-on: macos-15
    # The secrets live in this environment, which only master and v* tags can use
    environment: release
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Check signing secrets
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$CERTIFICATE_P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not set, keeping the ad hoc signed build"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: robo3t-macos-unsigned
          path: unsigned

      - name: Set up signing keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          umask 077
          P12="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$P12"' EXIT

          # A temporary keychain with a random password, deleted at the end of the job
          KEYCHAIN="$RUNNER_TEMP/robo3t-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Intermediate certificate, so codesign can build the chain to Apple's root
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$DEVELOPER_ID_G2_CA_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          # Let codesign use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                     | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE_P12_BASE64 has no valid Developer ID Application identity"
            exit 1
          fi

          xcrun notarytool store-credentials robo3t-notary --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN" > /dev/null

          {
            echo "ROBO_SIGN_IDENTITY=$IDENTITY"
            echo "ROBO_NOTARY_PROFILE=robo3t-notary"
            echo "ROBO_NOTARY_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Sign and notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          mkdir -p app
          ditto -x -k "unsigned/robo3t-$VERSION-macos-x86_64.zip" app
          # Developer ID signature with the hardened runtime, notarized and stapled app and DMG
          bin/sign-notarize-macos "app/Robo 3T.app" "$VERSION" dist

      - name: Keep the ad hoc signed build
        if: steps.signing.outputs.enabled != 'true'
        run: mkdir -p dist && cp unsigned/* dist/

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/robo3t-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robo3t-macos
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-macos, sign-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: robo3t-macos
          path: dist

      - name: Write release notes
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
          SIGNED: ${{ needs.sign-macos.outputs.signed }}
        run: |
          {
            python3 - <<'EOF'
          import os
          if os.environ["SIGNED"] == "true":
              note = "The app is signed with a Developer ID and notarized by Apple, so it opens normally."
          else:
              note = ('The app has an ad hoc signature only and is not notarized by Apple, so macOS refuses '
                      'the first launch with *"Apple could not verify "Robo 3T" is free of malware"*. Either run\n'
                      '   `xattr -dr com.apple.quarantine "/Applications/Robo 3T.app"`\n'
                      '   or try to open the app once, then go to **System Settings, Privacy & Security** and '
                      'click **Open Anyway** next to the message about Robo 3T.')
          print(open(".github/release-notes.md").read().replace("{{SIGNATURE_NOTE}}", note), end="")
          EOF
            echo
            echo "## Changes"
            echo
            echo '```'
            awk -v v="Robo 3T $VERSION " 'index($0, v) == 1 {p = 1; print; next} p && /^Robo 3T [0-9]/ {exit} p {print}' CHANGELOG
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Robo 3T $VERSION (unofficial community build)" --notes-file notes.md
